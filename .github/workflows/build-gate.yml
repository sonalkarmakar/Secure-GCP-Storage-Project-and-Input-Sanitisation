name: Poka-Yoke Build Gate

# Fail-Closed philosophy: the default state of this pipeline is BLOCKED.
# Every job below must explicitly PASS for the gate to open.
# Any lint failure, formatting violation, or detected secret halts the run immediately (fail-fast)
# and the offending artifact is quarantined rather than deployed or merged.

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: build-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  #================================================================#
  # JOB 1: Static formatting + lint gate (Python / Django backend)
  #================================================================#
  lint-and-format:
    name: Lint & Format Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: pip install black==24.4.2 flake8==7.0.0 isort==5.13.2

      - name: Check formatting (black --check)
        run: black --check --diff .

      - name: Check import order (isort --check)
        run: isort --check-only --diff .

      - name: Lint (flake8)
        run: flake8 . --max-line-length=100 --exclude=migrations,venv

  #===============================================================#
  # JOB 2: Secret-scan gate -- blocks on ANY hardcoded credential
  #===============================================================#
  secret-scan:
    name: Hardcoded Secret Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan prior commits in this PR

      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # gitleaks-action exits non-zero on any finding, which fails this
        # job and therefore blocks the "deploy-gate" job below via `needs:`.

  #========================================#
  # JOB 3: Django-specific security checks
  #========================================#
  django-security-check:
    name: Django Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + bandit
        run: |
          pip install -r requirements.txt
          pip install bandit==1.7.9

      - name: Run bandit static security scan
        run: bandit -r . -ll -x "*/migrations/*,*/tests/*"

      - name: Django deployment check (manage.py check --deploy)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.staging
          SECRET_KEY: ci-placeholder-not-a-real-secret
          DATABASE_URL: sqlite:///ci.db
        run: python manage.py check --deploy --fail-level WARNING

  #====================================================================#
  # JOB 4: Deploy gate -- ONLY runs if every prior job passed.
  # This is the actual "Fail-Closed" mechanism: absence of an explicit
  # upstream PASS is treated as FAIL, never as "skip and proceed."
  #====================================================================#
  deploy-gate:
    name: Fail-Closed Deploy Gate
    runs-on: ubuntu-latest
    needs: [lint-and-format, secret-scan, django-security-check]
    if: always()
    steps:
      - name: Evaluate upstream gate results
        run: |
          echo "lint-and-format: ${{ needs.lint-and-format.result }}"
          echo "secret-scan: ${{ needs.secret-scan.result }}"
          echo "django-security-check: ${{ needs.django-security-check.result }}"

          if [ "${{ needs.lint-and-format.result }}" != "success" ] || \
             [ "${{ needs.secret-scan.result }}" != "success" ] || \
             [ "${{ needs.django-security-check.result }}" != "success" ]; then
            echo "::error::One or more Poka-Yoke gates failed. Build is BLOCKED and quarantined."
            exit 1
          fi

          echo "All gates passed. Build is authorized to proceed to deployment."

      - name: Quarantine on failure
        if: failure()
        run: |
          echo "::warning::Quarantining build artifact. No deployment step will run."
          mkdir -p quarantine
          echo "Commit ${{ github.sha }} quarantined at $(date -u) due to failed gate(s)." > quarantine/reason.txt

      - name: Upload quarantine record
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quarantine-record-${{ github.sha }}
          path: quarantine/reason.txt

  #===========================================================#
  # JOB 5: Deploy -- only reachable if deploy-gate succeeded.
  #===========================================================#
  deploy-staging:
    name: Deploy to Staging (GCP App Engine)
    runs-on: ubuntu-latest
    needs: deploy-gate
    if: needs.deploy-gate.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy to App Engine
        run: gcloud app deploy app.staging.yaml --quiet